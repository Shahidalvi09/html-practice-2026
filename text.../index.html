<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>
<body>
    <header>
        <h1>html attributes</h1>
    </header>
    <main>
        <section id="id">
            <h2>id</h2>
            <p style="color: red;" class="text-red"> a unique identifire</p>
        </section>
        <section id="class">
            <h2>class</h2>
            <p style="color: blue;" class="text-red"> class is used to share style or javascript functionlity to multifile</p>
            <abbr title="hyper text markup language">HTML</abbr>
        </section>
        <section>
            <h2>style</h2>
            <p class="text-red" style="color: red;font-size: 1.50rem; ;">style attributes is used to add inline eliments</p>
        </section>
        <section id="tabindex">
            <h2>tab-index</h2>
            <button tabindex="0">button 2</button>
            <button tabindex="2">button 1</button>
            <a href="#" tabindex="1">link 1</a>
          
        </section>
        <section id="data">
            <h2>data-*</h2>
            <table>
                <thead>
                    <tr>
                        <th>sr no</th>
                        <th>Name</th>
                        <th>action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>shahid</td>
                        <td><button class="delete" data-userid="1">delete</button></td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>danish</td>
                        <td><button class="delete" data-userid="2">delete</button></td>
                    </tr><tr>
                        <td>3</td>
                        <td>bhupendra</td>
                        <td><button class="delete" data-userid="3">delete</button></td>
                    </tr>
                    <tr>
                        <td>4</td>
                        <td>aryan</td>
                        <td><button class="delete" data-userid="4">delete</button></td>
                    </tr>
                </tbody>
            </table>

        </section>


    </main>
</body>
</html>
